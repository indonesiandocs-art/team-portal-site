  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  .form-control,

  }

  .form-control[type=&quot;file&quot;]::file-selector-button {

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {

  .form-check {

    padding-inline: 15px;
  }

  .form-check-input {

  }

  .form-check-input::after {

    left: 50%;

    height: 44px;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;

  }

  .form-range {

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;mintai-fundamental-flow&#x27;);
  const companyButtons = [...root.querySelectorAll(&#x27;.company-btn&#x27;)];
  const routeButtons = [...root.querySelectorAll(&#x27;.route-btn&#x27;)];
  const direct = root.querySelector(&#x27;.direct&#x27;);
  const directLabel = root.querySelector(&#x27;.direct-label&#x27;);
  const fallback = [...root.querySelectorAll(&#x27;.fallback&#x27;)];
  const fallbackLabels = [...root.querySelectorAll(&#x27;.fallback-label&#x27;)];
  const supplierSub = root.querySelector(&#x27;.supplier-sub&#x27;);
  const detail = root.querySelector(&#x27;.route-detail&#x27;);
  const companyLabel = root.querySelector(&#x27;.company-label&#x27;);
  const mintaiAccountName = root.querySelector(&#x27;.mintai-account-name&#x27;);
  const sunrateAccountName = root.querySelector(&#x27;.sunrate-account-name&#x27;);
  let selectedCompany = &#x27;Stable Vision&#x27;;
  let selectedRoute = &#x27;direct&#x27;;

  function renderSelection() {
    const isDirect = selectedRoute === &#x27;direct&#x27;;
    companyButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.company === selectedCompany)));
    routeButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.route === selectedRoute)));
    companyLabel.textContent = selectedCompany.toUpperCase();
    mintaiAccountName.textContent = `${selectedCompany} account`;
    sunrateAccountName.textContent = `${selectedCompany} account`;
    direct.classList.toggle(&#x27;active&#x27;, isDirect);
    directLabel.classList.toggle(&#x27;active-label&#x27;, isDirect);
    direct.style.opacity = isDirect ? &#x27;1&#x27; : &#x27;.25&#x27;;
    fallback.forEach(edge =&gt; edge.classList.toggle(&#x27;active&#x27;, !isDirect));
    fallbackLabels.forEach(label =&gt; {
      label.classList.toggle(&#x27;active-label&#x27;, !isDirect);
      label.style.opacity = isDirect ? &#x27;.35&#x27; : &#x27;1&#x27;;
    });
    supplierSub.textContent = isDirect ? &#x27;accepts Mintai&#x27; : &#x27;paid via Sunrate&#x27;;
    detail.textContent = isDirect
      ? `Liquidity sources → ${selectedCompany} at Mintai Bank → Supplier`
      : `Liquidity sources → ${selectedCompany} at Mintai Bank → ${selectedCompany} at Sunrate → Supplier`;
  }

  companyButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    selectedCompany = button.dataset.company;
    renderSelection();
  }));
  routeButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    selectedRoute = button.dataset.route;
    renderSelection();
  }));
})();
&lt;/script&gt;
