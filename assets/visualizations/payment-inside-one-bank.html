<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment Inside One Bank</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#ffffff, #181818);
      --text: light-dark(#1a1c1f, #ffffff);
      --muted: light-dark(#667085, #a7afbd);
      --border: light-dark(#cfd5dd, #4a5361);
      --bank-bg: light-dark(#f5faff, #122b40);
      --company-bg: light-dark(#e5f3ff, #173b59);
      --supplier-bg: light-dark(#f4f5f7, #292c31);
      --arrow: light-dark(#338fd9, #83c3ff);
      --purpose-bg: light-dark(#ffffff, #181818);
      --purpose-text: light-dark(#1f6fa9, #a8d8ff);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      padding: 24px;
      color: var(--text);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .route {
      width: min(720px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 5px;
      font-size: 26px;
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .subtitle {
      margin: 0 0 38px;
      color: var(--muted);
      font-size: 15px;
    }

    .flow {
      display: grid;
      grid-template-columns: 112px 48px minmax(312px, 1fr) 48px 112px;
      align-items: center;
      gap: 8px;
    }

    .node {
      display: grid;
      place-items: center;
      min-height: 82px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--supplier-bg);
      text-align: center;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.15;
    }

    .bank {
      position: relative;
      display: grid;
      grid-template-columns: 112px 48px 112px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 166px;
      padding: 56px 12px 18px;
      border: 2px solid var(--arrow);
      border-radius: 17px;
      background: var(--bank-bg);
    }

    .bank-title {
      position: absolute;
      top: 15px;
      left: 12px;
      right: 12px;
      color: var(--purpose-text);
      text-align: center;
      font-size: 16px;
      font-weight: 650;
    }

    .bank .node { background: var(--company-bg); }

    .arrow {
      position: relative;
      height: 3px;
      background: var(--arrow);
    }

    .arrow::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -1px;
      width: 12px;
      height: 12px;
      border-top: 3px solid var(--arrow);
      border-right: 3px solid var(--arrow);
      transform: translateY(-50%) rotate(45deg);
    }

    .purpose {
      position: absolute;
      left: 50%;
      bottom: 10px;
      width: max-content;
      max-width: 104px;
      padding: 3px 4px;
      transform: translateX(-50%);
      color: var(--purpose-text);
      background: var(--purpose-bg);
      text-align: center;
      font-size: 11px;
      font-weight: 650;
      line-height: 1.2;
    }

    .bank .arrow .purpose {
      bottom: 10px;
      max-width: 96px;
      background: var(--bank-bg);
    }

    @media (max-width: 719px) {
      body { padding: 18px; }

      .flow {
        grid-template-columns: 1fr;
        justify-items: stretch;
      }

      .flow > .arrow {
        width: 4px;
        height: 72px;
        margin: 0 auto;
      }

      .flow > .arrow::after {
        top: auto;
        right: 50%;
        bottom: 0;
        transform: translateX(50%) rotate(135deg);
      }

      .flow > .arrow .purpose {
        left: 22px;
        bottom: 50%;
        transform: translateY(50%);
      }

      .bank {
        grid-template-columns: 1fr;
        padding-top: 78px;
      }

      .bank > .arrow {
        width: 4px;
        height: 80px;
        margin: 0 auto;
      }

      .bank > .arrow::after {
        top: auto;
        right: 50%;
        bottom: 0;
        transform: translateX(50%) rotate(135deg);
      }

      .bank .arrow .purpose {
        left: 22px;
        bottom: 50%;
        transform: translateY(50%);
      }

    }
  </style>
</head>
<body>
  <main class="route" aria-labelledby="route-title">
    <h1 id="route-title">Payment Purpose Inside One Bank</h1>
    <p class="subtitle">The complete route is executed through either UBL or Invest Bank.</p>

    <section class="flow" aria-label="Payment route from liquidity suppliers to final suppliers">
      <div class="node">Liquidity Suppliers</div>

      <div class="arrow" aria-label="Payment purpose: Commodity">
        <span class="purpose">Payment purpose<br>Commodity</span>
      </div>

      <div class="bank">
        <div class="bank-title">One Bank: UBL or Invest Bank</div>
        <div class="node">Crescent</div>
        <div class="arrow" aria-label="Payment purpose: Equipment">
          <span class="purpose">Payment purpose<br>Equipment</span>
        </div>
        <div class="node">Nova General</div>
      </div>

      <div class="arrow" aria-label="Payment purpose: Equipment">
        <span class="purpose">Payment purpose<br>Equipment</span>
      </div>

      <div class="node">Final Suppliers</div>
    </section>

  </main>
</body>
</html>
